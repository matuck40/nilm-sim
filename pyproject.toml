[project]
name = "nilm-sim"
version = "0.1.0"
description = "Synthetic house simulator and NILM baselines (Hart, Random Forest) with a Streamlit app"
requires-python = ">=3.12"
license = "MIT"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
